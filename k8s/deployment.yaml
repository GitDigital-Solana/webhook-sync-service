apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sync
  namespace: webhook-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-sync
  template:
    metadata:
      labels:
        app: webhook-sync
    spec:
      containers:
      - name: app
        image: your-registry/webhook-sync-service:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: webhook-sync-config
        - secretRef:
            name: webhook-sync-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5